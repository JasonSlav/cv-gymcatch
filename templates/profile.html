<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koribantes - Profil</title>
    <style>
        :root {
            --bg-color: #000000;
            --bg-card: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #a1a1a6;
            --accent-cyan: #00bfff;
            --border-color: #333333;
            --font-main: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            position: relative;
            background-color: var(--bg-card);
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 40px;
            width: min(480px, calc(100vw - 40px));
            margin: auto;
        }

        .lang-toggle {
            position: absolute;
            top: 16px;
            right: 18px;
            display: flex;
            gap: 3px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 2px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-main);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .lang-btn.active { background: #ffffff; color: #000000; }

        .auth-card img { height: 44px; display: block; margin: 0 auto 18px auto; }

        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 24px; }
        .text-cyan { color: var(--accent-cyan); }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .divider {
            height: 1px;
            background: #2a2a2a;
            margin: 26px 0;
        }

        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }

        input {
            width: 100%;
            background: #141414;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        input:focus { outline: none; border-color: var(--accent-cyan); }

        .btn-submit {
            width: 100%;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 12px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-submit:hover { filter: brightness(1.15); }

        .flash {
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .flash.success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.45);
            color: #86efac;
        }

        .flash.error {
            background: rgba(220, 38, 38, 0.12);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #fca5a5;
        }

        .auth-links {
            margin-top: 22px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .auth-links a { color: var(--accent-cyan); text-decoration: none; }
        .auth-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="lang-toggle" id="langToggle">
            <button type="button" class="lang-btn active" data-lang="id">ID</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>

        <img src="/static/logo_koribantes.png" alt="Koribantes Logo">
        <h1 data-id="Profil <span class='text-cyan'>Koribantes</span>"
            data-en="<span class='text-cyan'>Koribantes</span> Profile">Profil <span class="text-cyan">Koribantes</span></h1>

        {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="flash {{ category }}"
             data-id="{{ message.id }}"
             data-en="{{ message.en }}">{{ message.id }}</div>
        {% endfor %}

        <form method="post" action="/profile/update">
            <h2 class="section-title" data-id="Edit Profil" data-en="Edit Profile">Edit Profil</h2>

            <label for="username" data-id="Username" data-en="Username">Username</label>
            <input type="text" id="username" name="username"
                   value="{{ user.username }}" required autocomplete="username">

            <label for="full_name" data-id="Nama Lengkap" data-en="Full Name">Nama Lengkap</label>
            <input type="text" id="full_name" name="full_name"
                   value="{{ user.full_name or '' }}" autocomplete="name">

            <label for="email" data-id="Email" data-en="Email">Email</label>
            <input type="email" id="email" name="email"
                   value="{{ user.email or '' }}" autocomplete="email">

            <button type="submit" class="btn-submit"
                    data-id="Simpan Perubahan"
                    data-en="Save Changes">Simpan Perubahan</button>
        </form>

        <div class="divider"></div>

        <form method="post" action="/profile/password">
            <h2 class="section-title" data-id="Ganti Password" data-en="Change Password">Ganti Password</h2>

            <label for="old_password" data-id="Password Lama" data-en="Current Password">Password Lama</label>
            <input type="password" id="old_password" name="old_password"
                   required autocomplete="current-password">

            <label for="new_password" data-id="Password Baru" data-en="New Password">Password Baru</label>
            <input type="password" id="new_password" name="new_password"
                   required minlength="4" autocomplete="new-password">

            <label for="confirm_password"
                   data-id="Konfirmasi Password Baru"
                   data-en="Confirm New Password">Konfirmasi Password Baru</label>
            <input type="password" id="confirm_password" name="confirm_password"
                   required minlength="4" autocomplete="new-password">

            <button type="submit" class="btn-submit"
                    data-id="Ganti Password"
                    data-en="Change Password">Ganti Password</button>
        </form>

        <div class="auth-links">
            <a href="/" data-id="Beranda" data-en="Home">Beranda</a>
            &nbsp;·&nbsp;
            <a href="/history" data-id="Aktivitas" data-en="Activity">Aktivitas</a>
            &nbsp;·&nbsp;
            <a href="/logout" data-id="Logout" data-en="Logout">Logout</a>
        </div>
    </div>

    <script>
        (function () {
            function applyLang(lang) {
                if (lang !== "id" && lang !== "en") lang = "id";
                localStorage.setItem("gc-lang", lang);
                document.documentElement.lang = lang;

                document.querySelectorAll("[data-id]").forEach(el => {
                    el.innerHTML = el.getAttribute("data-" + lang) || el.getAttribute("data-id");
                });

                document.querySelectorAll(".lang-btn").forEach(btn => {
                    btn.classList.toggle("active", btn.dataset.lang === lang);
                });
            }

            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.addEventListener("click", () => applyLang(btn.dataset.lang));
            });

            applyLang(localStorage.getItem("gc-lang") || "id");
        })();
    </script>
</body>
</html>
