<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Catch - Masuk</title>
    <style>
        :root {
            --bg-color: #000000;
            --bg-card: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #a1a1a6;
            --accent-cyan: #00bfff;
            --border-color: #333333;
            --font-main: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 40px;
            width: min(400px, calc(100vw - 40px));
        }

        .auth-card img { height: 44px; display: block; margin: 0 auto 18px auto; }

        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 24px; }
        .text-cyan { color: var(--accent-cyan); }

        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }

        input {
            width: 100%;
            background: #141414;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        input:focus { outline: none; border-color: var(--accent-cyan); }

        .btn-submit {
            width: 100%;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 12px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-submit:hover { filter: brightness(1.15); }

        .error {
            background: rgba(220, 38, 38, 0.12);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #fca5a5;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .auth-links {
            margin-top: 18px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .auth-links a { color: var(--accent-cyan); text-decoration: none; }
        .auth-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <img src="/static/logo.png" alt="Gym Catch Logo">
        <h1 data-id="Masuk ke <span class='text-cyan'>Gym Catch</span>"
            data-en="Sign in to <span class='text-cyan'>Gym Catch</span>">Masuk ke <span class="text-cyan">Gym Catch</span></h1>

        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <form method="post" action="/login">
            <label for="username" data-id="Username" data-en="Username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username">

            <label for="password" data-id="Password" data-en="Password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit" class="btn-submit" data-id="Masuk" data-en="Sign In">Masuk</button>
        </form>

        <div class="auth-links">
            <span data-id="Belum punya akun?" data-en="No account yet?">Belum punya akun?</span>
            <a href="/register" data-id="Daftar" data-en="Register">Daftar</a>
            &nbsp;·&nbsp;
            <a href="/" data-id="Beranda" data-en="Home">Beranda</a>
        </div>
    </div>

    <script>
        (function () {
            const lang = localStorage.getItem("gc-lang") || "id";
            document.documentElement.lang = lang;
            document.querySelectorAll("[data-id]").forEach(el => {
                el.innerHTML = el.getAttribute("data-" + lang) || el.getAttribute("data-id");
            });
        })();
    </script>
</body>
</html>
