<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koribantes - Lupa Password</title>
    <style>
        :root {
            --bg-color: #000000;
            --bg-card: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #a1a1a6;
            --accent-cyan: #00bfff;
            --border-color: #333333;
            --font-main: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 40px;
            width: min(400px, calc(100vw - 40px));
        }

        .auth-card img { height: 44px; display: block; margin: 0 auto 18px auto; }

        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 12px; }
        .text-cyan { color: var(--accent-cyan); }

        .auth-desc {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }

        input {
            width: 100%;
            background: #141414;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        input:focus { outline: none; border-color: var(--accent-cyan); }

        .btn-submit {
            width: 100%;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 12px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-submit:hover { filter: brightness(1.15); }

        .flash {
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .flash.success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.45);
            color: #86efac;
        }

        .flash.error {
            background: rgba(220, 38, 38, 0.12);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #fca5a5;
        }

        .auth-links {
            margin-top: 18px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .auth-links a { color: var(--accent-cyan); text-decoration: none; }
        .auth-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <img src="/static/logo_koribantes.png" alt="Koribantes Logo">
        <h1 data-id="Lupa <span class='text-cyan'>Password</span>"
            data-en="Forgot <span class='text-cyan'>Password</span>">Lupa <span class="text-cyan">Password</span></h1>

        <p class="auth-desc"
           data-id="Masukkan email akunmu. Kami akan menyiapkan halaman reset password."
           data-en="Enter your account email. We will prepare a password reset page.">Masukkan email akunmu. Kami akan menyiapkan halaman reset password.</p>

        {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="flash {{ category }}"
             data-id="{{ message.id }}"
             data-en="{{ message.en }}">{{ message.id }}</div>
        {% endfor %}

        <form method="post" action="/forgot-password">
            <label for="email" data-id="Email" data-en="Email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">

            <button type="submit" class="btn-submit"
                    data-id="Kirim Link Reset"
                    data-en="Send Reset Link">Kirim Link Reset</button>
        </form>

        <div class="auth-links">
            <a href="/login" data-id="Kembali ke Masuk" data-en="Back to Sign In">Kembali ke Masuk</a>
            &nbsp;·&nbsp;
            <a href="/" data-id="Beranda" data-en="Home">Beranda</a>
        </div>
    </div>

    <script>
        (function () {
            const lang = localStorage.getItem("gc-lang") || "id";
            document.documentElement.lang = lang;
            document.querySelectorAll("[data-id]").forEach(el => {
                el.innerHTML = el.getAttribute("data-" + lang) || el.getAttribute("data-id");
            });
        })();
    </script>
</body>
</html>
